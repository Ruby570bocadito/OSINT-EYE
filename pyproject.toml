[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-eye"
# Versión única en core/__init__.py (tarea version-unica): se deriva vía attr.
# El literal no se repite aquí para que no pueda volver a divergir.
dynamic = ["version"]
description = "AI-Powered Attack Surface Intelligence — plataforma OSINT y reconocimiento de superficie de ataque"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "OSINT EYE Team" }]
keywords = ["osint", "reconnaissance", "attack-surface", "security", "pentesting", "bugbounty"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Paridad 1:1 con requirements.txt: ui/__init__ y reporting/__init__ importan
# flask/textual/reportlab en el arranque del CLI (import eagre), así que hoy el
# base no puede rebajarse. Cuando IMP-2/IMP-3 hagan lazy esos imports, mover
# flask/textual aquí fuera y dejar el base mínimo.
dependencies = [
    "aiohttp>=3.9.0",
    "dnspython>=2.4.0",
    "flask>=3.0.0",
    "ipwhois>=1.2.0",
    "networkx>=3.0",
    "pyvis>=0.3.2",
    "python-nmap>=0.7.1",
    "python-whois>=0.9.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
ui = ["flask>=3.0.0", "textual>=0.40.0"]
pdf = ["reportlab>=4.0.0"]
dev = ["mypy>=1.8.0", "pytest>=8.0.0", "pytest-cov>=4.1.0", "ruff>=0.4.0"]

[project.scripts]
osint-eye = "osint_eye:main"

[project.urls]
Repository = "https://github.com/Ruby570bocadito/OSINT-EYE"
Changelog = "https://github.com/Ruby570bocadito/OSINT-EYE/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["osint_eye"]

[tool.setuptools.dynamic]
version = { attr = "core.__version__" }

[tool.setuptools.packages.find]
include = ["ai", "ai.*", "core", "core.*", "graph", "graph.*", "modules", "modules.*", "reporting", "reporting.*", "ui", "ui.*"]

[tool.ruff]
# Configuración acordada en ROADMAP v2.2 (tarea ruff-config, PUL-2).
# pyflakes + pycodestyle (subset) + isort + pyupgrade + bugbear, 0 avisos.
target-version = "py310"
extend-exclude = ["venv", ".agent-tmp", "output", "data"]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle: E401 (varios imports por línea), E402 (imports fuera de cabecera)
    "E7",  # pycodestyle: sentencias problemáticas (except desnudo, comparaciones a True/None…)
    "E9",  # pycodestyle: errores de sintaxis/runtime (ya era el gate de CI)
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (py3.10+)
    "B",   # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["ai", "core", "graph", "modules", "reporting", "ui"]

[tool.mypy]
# type-hints-core (PUL-2): adopción incremental de strict. Fase 1a estricta:
# core.async_engine, core.plugins, graph.neo4j_exporter. Los módulos aún sin
# tipar se relajan temporalmente en los overrides; cada fase posterior quita
# entradas de esa lista al tipar su zona hasta dejar core/ y graph/ completos.
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# Zonas pendientes de tipar (fases 1b/1c/2 de type-hints-core, IMP activo en
# modules/): errors silenciados aquí, no en los ficheros ya estrictos.
module = [
    "core.logging_config",
    "core.scan_diff",
    "graph.builder",
    "modules",
    "modules.*",
]
ignore_errors = true
