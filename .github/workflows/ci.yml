name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff sanity check (E9)
        # Puerta mínima que hoy pasa a 0. El ruleset completo (pyflakes, isort,
        # pyupgrade, bugbear) lo introduce PUL-2 en (PUL-2) ruff-config; cuando
        # el repo esté a 0 avisos se sube el nivel aquí.
        run: ruff check --select E9 --no-fix .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap whois

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check
        run: python -m compileall -q osint_eye.py core graph ai modules ui reporting tests

      - name: Offline unit tests
        run: pytest -q tests/ -x
        env:
          PYTHONPATH: ${{ github.workspace }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Offline tests with coverage
        run: >
          pytest -q tests/
          --cov=core --cov=modules --cov=graph --cov=reporting --cov=ui --cov=ai --cov=osint_eye
          --cov-report=term-missing --cov-report=xml
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  badges:
    # Fin de la deriva manual: los badges Tests/Version del README (README.md y
    # README.es.md) apuntan a estos endpoint JSON de shields.io servidos desde
    # el propio repo. Solo en push a main; el commit lleva [skip ci] para no
    # re-disparar el workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Count tests and read version
        run: |
          TESTS=$(PYTHONPATH=$GITHUB_WORKSPACE pytest --collect-only -q tests/ 2>/dev/null | tail -n 1 | grep -oE '^[0-9]+')
          if [ -z "$TESTS" ]; then
            echo "::error::No se pudo contar la suite de tests"
            exit 1
          fi
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          {
            echo "TESTS=$TESTS"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"

      - name: Write badge JSONs
        run: |
          mkdir -p .github/badges
          printf '{"schemaVersion": 1, "label": "Tests", "message": "%s passing", "color": "3FB68B"}\n' "$TESTS" > .github/badges/tests.json
          printf '{"schemaVersion": 1, "label": "Version", "message": "%s", "color": "7c3aed"}\n' "$VERSION" > .github/badges/version.json
          cat .github/badges/tests.json .github/badges/version.json

      - name: Commit badges if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain .github/badges)" ]; then
            git add .github/badges
            git commit -m "chore(badges): tests $TESTS, version $VERSION [skip ci]"
            git push
          else
            echo "Badges sin cambios, nada que commitear"
          fi

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t osint-eye:ci .

      - name: Smoke test (--help)
        run: docker run --rm osint-eye:ci --help
