<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT EYE — Attack Surface Intelligence</title>
<style>
  :root {
    --bg: #0A0B0E;
    --surface: #101216;
    --surface-2: #15181E;
    --border: #23262E;
    --border-strong: #31353F;
    --text: #E8EAF0;
    --muted: #8B91A0;
    --faint: #5A5F6C;
    --accent: #5B8DEF;
    --accent-soft: rgba(91, 141, 239, 0.12);
    --ok: #3FB68B;
    --warn: #E0A458;
    --danger: #E5484D;
    --critical: #FF5D5D;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }

  /* ---------- topbar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    background: rgba(10, 11, 14, 0.88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: 0.2px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    display: grid; place-items: center;
    color: var(--accent); font-size: 13px; font-weight: 700;
  }
  .brand small { color: var(--faint); font-weight: 500; margin-left: 2px; }
  .targets { display: flex; gap: 6px; flex: 1; overflow-x: auto; padding: 2px; }
  .targets::-webkit-scrollbar { height: 4px; }
  .targets::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
  .target-pill {
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px;
    font: inherit; font-size: 13px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
    white-space: nowrap;
  }
  .target-pill:hover { color: var(--text); border-color: var(--border-strong); }
  .target-pill.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .score-chip {
    display: flex; align-items: baseline; gap: 8px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px 12px; background: var(--surface);
  }
  .score-chip .num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score-chip .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .sev-LOW { color: var(--ok); } .sev-MEDIUM { color: var(--warn); }
  .sev-HIGH { color: var(--danger); } .sev-CRITICAL { color: var(--critical); }
  .export-group { display: flex; align-items: center; gap: 6px; }
  .export-group .f-label { margin-right: 2px; }
  .export-btn {
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 6px 12px;
    font: inherit; font-size: 12.5px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .export-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- layout ---------- */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 28px 48px; }
  .banner {
    display: none; align-items: center; gap: 10px;
    border: 1px solid rgba(224, 164, 88, .35); background: rgba(224, 164, 88, .08);
    color: var(--warn); border-radius: var(--radius-sm);
    padding: 10px 16px; margin-bottom: 20px; font-size: 13px;
  }
  .banner.show { display: flex; }

  .stats {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .8px; margin-top: 2px;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid .span-2 { grid-column: span 2; }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .panel-h {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .panel-h h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .panel-h .meta { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .panel-b { padding: 8px 0; }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .7px; color: var(--faint);
    padding: 8px 18px; border-bottom: 1px solid var(--border);
  }
  td { padding: 9px 18px; font-size: 13px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; color: var(--text); }
  td.mono, .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 12.5px; }
  td.muted { color: var(--muted); }

  /* ---------- chips ---------- */
  .sev {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; letter-spacing: .3px;
  }
  .sev::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .sev.info { color: var(--muted); }
  .sev.low { color: var(--accent); }
  .sev.medium { color: var(--warn); }
  .sev.high { color: var(--danger); }
  .sev.critical { color: var(--critical); }

  /* ---------- chains ---------- */
  .chain { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .chain:last-child { border-bottom: none; }
  .chain-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .chain-name { font-weight: 600; font-size: 13.5px; }
  .chain-risk { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .chain-risk b { color: var(--text); }
  .step { display: flex; gap: 10px; padding: 4px 0 4px 2px; font-size: 13px; color: var(--muted); }
  .step .n {
    flex: 0 0 18px; height: 18px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--border-strong);
    color: var(--muted); font-size: 10.5px; display: grid; place-items: center;
    margin-top: 2px; font-variant-numeric: tabular-nums;
  }

  /* ---------- graph ---------- */
  #graph-box { height: 420px; position: relative; }
  #graph-box svg { width: 100%; height: 100%; display: block; }
  .g-toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 0 10px;
  }
  .g-toolbar input[type="search"] {
    flex: 1 1 160px; min-width: 140px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 5px 10px; font-size: 12.5px;
  }
  .g-toolbar input[type="search"]:focus { outline: none; border-color: var(--accent); }
  .g-toolbar button, .g-chip {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    color: var(--muted); font-size: 11.5px; padding: 3px 10px; cursor: pointer;
  }
  .g-toolbar button:hover, .g-chip:hover { color: var(--text); border-color: var(--border-strong); }
  .g-chip.on { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .g-toolbar button.active { color: var(--warn); border-color: var(--warn); }
  .g-edge { stroke: var(--border-strong); stroke-opacity: .8; }
  .g-node { cursor: grab; }
  .g-node:active { cursor: grabbing; }
  .g-label { fill: var(--muted); font-size: 10.5px; font-family: ui-monospace, Menlo, monospace; pointer-events: none; }
  .g-legend {
    position: absolute; bottom: 10px; left: 14px; display: flex; gap: 14px;
    font-size: 11px; color: var(--faint);
  }
  .g-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  /* ---------- filter bar (findings explorer) ---------- */
  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .filter-bar input[type="search"] {
    flex: 1 1 220px; min-width: 160px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 7px 12px; font: inherit; font-size: 13px; outline: none;
    transition: border-color .15s;
  }
  .filter-bar input[type="search"]::placeholder { color: var(--faint); }
  .filter-bar input[type="search"]:focus { border-color: var(--accent); }
  .filter-bar select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 7px 10px; font: inherit; font-size: 13px; outline: none; cursor: pointer;
    transition: border-color .15s;
  }
  .filter-bar select:focus { border-color: var(--accent); }
  .filter-bar button {
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
    transition: border-color .15s;
  }
  .filter-bar button:hover { border-color: var(--accent); }
  .assets-note {
    padding: 10px 18px; color: var(--faint); font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  .f-label {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .7px;
  }

  /* ---------- scan comparison (diff) ---------- */
  .diff-score {
    display: flex; align-items: baseline; gap: 10px;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--muted);
  }
  .diff-score b { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
  .diff-score .up { color: var(--danger); }
  .diff-score .down { color: var(--ok); }
  .diff-group-h {
    padding: 10px 18px 4px; font-size: 11.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .7px;
  }
  .diff-group-h.added { color: var(--ok); }
  .diff-group-h.removed { color: var(--danger); }
  .diff-group-h.changed { color: var(--warn); }
  td.diff-add { color: var(--ok); font-weight: 600; }
  td.diff-del { color: var(--danger); font-weight: 600; }
  td.diff-chg { color: var(--warn); font-weight: 600; }

  /* ---------- auto-refresh (monitor mode) ---------- */
  .live-chip {
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); border-radius: 20px;
    padding: 5px 12px; font-size: 12px; font-weight: 700;
    letter-spacing: .6px; color: var(--ok); background: rgba(16,185,129,.08);
  }
  .live-chip[hidden] { display: none; }
  .live-chip.paused { color: var(--warn); background: rgba(245,158,11,.08); }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor;
    animation: live-pulse 1.6s ease-out infinite;
  }
  .live-chip.paused .live-dot { animation: none; }
  .live-chip button {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    border-radius: 12px; font-size: 11px; padding: 1px 8px; cursor: pointer;
  }
  .live-chip button:hover { color: var(--text); border-color: var(--border-strong); }
  @keyframes live-pulse { 0% { opacity: 1; } 50% { opacity: .25; } 100% { opacity: 1; } }

  /* ---------- timeline (evolution between scans) ---------- */
  .tl { position: relative; padding-left: 18px; }
  .tl::before {
    content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px;
    width: 2px; background: var(--border);
  }
  .tl-event { position: relative; padding: 8px 0 14px; }
  .tl-event::before {
    content: ""; position: absolute; left: -18px; top: 12px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--panel-bg, #14161c);
  }
  .tl-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .tl-date { font-weight: 700; font-size: 13px; color: var(--text); }
  .tl-target { color: var(--muted); font-size: 12.5px; }
  .tl-score { font-size: 11.5px; color: var(--muted); }
  .tl-deltas { display: flex; gap: 8px; margin: 6px 0 4px; }
  .tl-badge {
    display: inline-flex; gap: 5px; align-items: center;
    border-radius: 12px; padding: 2px 10px; font-size: 11.5px; font-weight: 700;
  }
  .tl-badge.up { color: var(--ok); background: rgba(16,185,129,.10); }
  .tl-badge.down { color: var(--danger); background: rgba(239,68,68,.10); }
  .tl-badge.flat { color: var(--muted); background: rgba(148,163,184,.10); }
  .tl-list { margin: 2px 0 0; padding: 0; list-style: none; }
  .tl-list li { font-size: 12.5px; color: var(--muted); padding: 1px 0; }
  .tl-list b { color: var(--text); font-weight: 600; }

  /* ---------- empty states ---------- */
  .empty {
    display: grid; place-items: center; gap: 6px;
    padding: 44px 20px; color: var(--faint); font-size: 13px;
  }
  .empty::before { content: "◇"; font-size: 20px; color: var(--border-strong); }
  .foot {
    display: flex; gap: 18px; align-items: center;
    color: var(--faint); font-size: 12px; padding: 18px 2px 0;
  }
  .foot .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); }

  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    .grid { grid-template-columns: 1fr; }
    .grid .span-2 { grid-column: span 1; }
    .topbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">OE</span>OSINT EYE <small>dashboard</small></div>
    <nav class="targets" id="targets"></nav>
    <div class="score-chip">
      <span class="num" id="score-num">–</span>
      <span class="lbl" id="score-sev">risk</span>
    </div>
    <div class="live-chip" id="live-chip" hidden>
      <span class="live-dot" aria-hidden="true"></span>
      <span id="live-label">LIVE</span>
      <button type="button" id="live-toggle">pause</button>
    </div>
    <div class="export-group" id="export-group">
      <span class="f-label">Export</span>
      <button type="button" class="export-btn" data-fmt="json">JSON</button>
      <button type="button" class="export-btn" data-fmt="csv">CSV</button>
      <button type="button" class="export-btn" data-fmt="md">MD</button>
    </div>
  </header>

  <main class="wrap">
    <div class="banner" id="banner"></div>

    <section class="stats">
      <div class="stat"><div class="v" id="s-subs">0</div><div class="k">Subdomains</div></div>
      <div class="stat"><div class="v" id="s-ports">0</div><div class="k">Open Ports</div></div>
      <div class="stat"><div class="v" id="s-tech">0</div><div class="k">Technologies</div></div>
      <div class="stat"><div class="v" id="s-cves">0</div><div class="k">CVEs</div></div>
      <div class="stat"><div class="v" id="s-emails">0</div><div class="k">Emails</div></div>
      <div class="stat"><div class="v" id="s-mitre">0</div><div class="k">MITRE Findings</div></div>
    </section>

    <section class="grid">
      <div class="panel span-2">
        <div class="panel-h"><h2>Attack Surface Graph</h2><span class="meta" id="graph-meta"></span></div>
        <div class="g-toolbar">
          <input type="search" id="g-search" placeholder="Find node…" autocomplete="off" spellcheck="false">
          <button type="button" id="g-paths" title="Highlight attack paths from the target to risk nodes">Attack paths</button>
          <button type="button" id="g-export-svg">SVG</button>
          <button type="button" id="g-export-png">PNG</button>
        </div>
        <div id="graph-box">
          <div class="g-legend" id="graph-legend"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-h"><h2>Open Ports</h2><span class="meta" id="ports-meta"></span></div>
        <div id="ports-body"></div>
      </div>

      <div class="panel">
        <div class="panel-h"><h2>Technologies</h2><span class="meta" id="tech-meta"></span></div>
        <div id="tech-body"></div>
      </div>

      <div class="panel">
        <div class="panel-h"><h2>MITRE ATT&amp;CK</h2><span class="meta" id="mitre-meta"></span></div>
        <div id="mitre-body"></div>
      </div>

      <div class="panel">
        <div class="panel-h"><h2>Attack Chains</h2><span class="meta" id="chains-meta"></span></div>
        <div id="chains-body"></div>
      </div>

      <div class="panel span-2">
        <div class="panel-h"><h2>Findings Explorer</h2><span class="meta" id="assets-meta"></span></div>
        <div class="filter-bar">
          <input type="search" id="f-search" placeholder="Search asset or detail…" autocomplete="off" spellcheck="false">
          <select id="f-severity" aria-label="Filter by severity"></select>
          <select id="f-type" aria-label="Filter by asset type"></select>
          <select id="f-module" aria-label="Filter by module"></select>
          <button type="button" id="f-clear">Reset</button>
        </div>
        <div id="assets-body"></div>
      </div>

      <div class="panel span-2">
        <div class="panel-h"><h2>Surface Timeline</h2><span class="meta" id="timeline-meta"></span></div>
        <div id="timeline-body"></div>
      </div>

      <div class="panel span-2">
        <div class="panel-h"><h2>Scan Comparison</h2><span class="meta" id="diff-meta"></span></div>
        <div class="filter-bar">
          <label class="f-label" for="diff-from">From</label>
          <select id="diff-from"></select>
          <label class="f-label" for="diff-to">To</label>
          <select id="diff-to"></select>
          <button type="button" id="diff-run">Compare</button>
        </div>
        <div id="diff-body"></div>
      </div>
    </section>

    <div class="foot">
      <span id="foot-target"></span><span class="dot"></span>
      <span id="foot-date"></span><span class="dot"></span>
      <span id="foot-depth"></span>
    </div>
  </main>

<script>
"use strict";

/* ---------- helpers (XSS-safe: everything via textContent) ---------- */
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function setEmpty(container, message) {
  clear(container);
  container.appendChild(el("div", "empty", message));
}

async function getJSON(url) {
  try {
    const resp = await fetch(url);
    if (!resp.ok) return null;
    return await resp.json();
  } catch (err) {
    return null;
  }
}

/* ---------- topbar / targets ---------- */
let currentTarget = null;

async function loadTargets(keepTarget) {
  const data = await getJSON("/api/scans");
  if (!data) return;

  const banner = $("banner");
  clear(banner);
  if (data.warning) {
    banner.appendChild(el("span", null, "⚠ " + data.warning));
    banner.classList.add("show");
  } else {
    banner.classList.remove("show");
  }

  const nav = $("targets");
  clear(nav);
  (data.scans || []).forEach((s) => {
    const pill = el("button", "target-pill", s.target);
    pill.addEventListener("click", () => selectTarget(s.target));
    nav.appendChild(pill);
  });

  if ((data.scans || []).length > 0) {
    const keep = keepTarget && (data.scans || []).some((s) => s.target === keepTarget);
    selectTarget(keep ? keepTarget : data.scans[0].target);
  } else {
    setEmpty($("ports-body"), "No scans loaded");
    setEmpty($("tech-body"), "No scans loaded");
    setEmpty($("mitre-body"), "No scans loaded");
    setEmpty($("chains-body"), "No scans loaded");
    setEmpty($("assets-body"), "No scans loaded");
    setEmpty($("diff-body"), "No scans loaded");
    setEmpty($("timeline-body"), "No scans loaded");
    setEmpty($("graph-box"), "No graph data");
  }
  fillScanSelectors();
}

/* ---------- summary ---------- */
async function selectTarget(target) {
  currentTarget = target;
  document.querySelectorAll(".target-pill").forEach((p) => {
    p.classList.toggle("active", p.textContent === target);
  });

  const summary = await getJSON(`/api/scan/${encodeURIComponent(target)}/summary`);
  if (!summary) return;

  $("s-subs").textContent = summary.subdomains ?? 0;
  $("s-ports").textContent = summary.open_ports ?? 0;
  $("s-tech").textContent = (summary.technologies || []).length;
  $("s-cves").textContent = summary.cves ?? 0;
  $("s-emails").textContent = summary.emails ?? 0;
  $("s-mitre").textContent = summary.mitre_findings ?? 0;

  const score = summary.attack_surface_score || {};
  $("score-num").textContent = score.score != null ? score.score : "–";
  const sev = String(score.severity || "LOW").toUpperCase();
  $("score-sev").textContent = sev;
  $("score-num").className = "num sev-" + sev;

  $("foot-target").textContent = "Target: " + (summary.target || target);
  $("foot-date").textContent = "Scanned: " + (summary.date || "—");
  $("foot-depth").textContent = "Depth: " + (summary.depth || "—");

  renderPorts(target);
  renderTech(summary.technologies || []);
  renderMitre(target);
  renderChains(target);
  renderGraph(target);
  renderAssetsFor(target);
  renderTimeline(target);
}

/* ---------- ports ---------- */

/* ---------- findings explorer (search + filters) ---------- */
let ASSETS = [];
const ASSET_RENDER_CAP = 200;
const SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };

function populateSelect(sel, values, label) {
  const previous = sel.value;
  clear(sel);
  const all = el("option", null, label + ": all");
  all.value = "all";
  sel.appendChild(all);
  values.forEach((v) => {
    const opt = el("option", null, v);
    opt.value = v;
    sel.appendChild(opt);
  });
  const has = Array.from(sel.options).some((o) => o.value === previous);
  sel.value = has ? previous : "all";
}

function assetPasses(a) {
  const q = $("f-search").value.trim().toLowerCase();
  if (q && !(a.name + " " + a.detail).toLowerCase().includes(q)) return false;
  if ($("f-severity").value !== "all" && a.severity !== $("f-severity").value) return false;
  if ($("f-type").value !== "all" && a.type !== $("f-type").value) return false;
  if ($("f-module").value !== "all" && a.module !== $("f-module").value) return false;
  return true;
}

function renderAssets() {
  const body = $("assets-body");
  const rows = ASSETS.filter(assetPasses);
  $("assets-meta").textContent = ASSETS.length
    ? rows.length + " of " + ASSETS.length + " shown"
    : "";
  if (!ASSETS.length) {
    setEmpty(body, "No findings for this scan");
    return;
  }
  if (!rows.length) {
    setEmpty(body, "No findings match the current filters");
    return;
  }

  const table = el("table");
  const thead = el("thead");
  const hr = el("tr");
  ["Severity", "Type", "Asset", "Module", "Detail"].forEach((h) => hr.appendChild(el("th", null, h)));
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = el("tbody");
  rows.slice(0, ASSET_RENDER_CAP).forEach((a) => {
    const tr = el("tr");
    const tdSev = el("td");
    tdSev.appendChild(el("span", "sev " + a.severity, a.severity));
    tr.appendChild(tdSev);
    tr.appendChild(el("td", "muted", a.type));
    tr.appendChild(el("td", "mono", a.name));
    tr.appendChild(el("td", "muted", a.module));
    tr.appendChild(el("td", "muted", a.detail || "—"));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  clear(body);
  body.appendChild(table);
  if (rows.length > ASSET_RENDER_CAP) {
    const note = el("div", "assets-note",
      "Showing first " + ASSET_RENDER_CAP + " of " + rows.length + " — refine the filters to narrow it down");

/* ---------- scan comparison (diff between two loaded scans) ---------- */
const DIFF_GROUPS = [
  ["new_subdomains", "added", "new subdomains", (x) => x],
  ["removed_subdomains", "removed", "removed subdomains", (x) => x],
  ["new_ports", "added", "new open ports", (p) => (p.host ? p.host + " : " : "") + p.port + (p.service ? " (" + p.service + ")" : "")],
  ["closed_ports", "removed", "closed ports", (p) => (p.host ? p.host + " : " : "") + p.port],
  ["changed_services", "changed", "changed services", (s) => (s.host ? s.host + " : " : "") + s.port + " " + (s.service || "") + " — " + (s.old_version || "—") + " → " + (s.new_version || "—")],
  ["new_technologies", "added", "new technologies", (x) => x],
  ["removed_technologies", "removed", "removed technologies", (x) => x],
  ["new_emails", "added", "new emails", (x) => x],
  ["new_cves", "added", "new CVEs", (c) => (c.id || "?") + (Array.isArray(c.severity) && c.severity[0] ? " (CVSS " + (c.severity[0].score ?? "?") + ")" : "")],
  ["new_cloud_buckets", "added", "new cloud buckets", (b) => (b.url || b.bucket || "?")],
];
const DIFF_GROUP_CAP = 50;

function fillScanSelectors() {
  const targets = Array.from(document.querySelectorAll(".target-pill")).map((p) => p.textContent);
  ["diff-from", "diff-to"].forEach((id) => {
    clear($(id));
    targets.forEach((t) => {
      const opt = el("option", null, t);
      opt.value = t;
      $(id).appendChild(opt);
    });
  });
  if (targets.length >= 2) {
    $("diff-from").value = targets[0];
    $("diff-to").value = targets[targets.length - 1];
  }
}

function diffRow(markerCls, marker, text) {
  const tr = el("tr");
  tr.appendChild(el("td", "mono " + markerCls, marker));
  tr.appendChild(el("td", "mono", text));
  return tr;
}

async function runDiff() {
  const body = $("diff-body");
  const from = $("diff-from").value;
  const to = $("diff-to").value;
  if (!from || !to) {
    setEmpty(body, "Load at least two scans to compare");
    return;
  }
  if (from === to) {
    setEmpty(body, "Pick two different scans");
    return;
  }

  const data = await getJSON(`/api/scan/${encodeURIComponent(to)}/diff?against=${encodeURIComponent(from)}`);
  if (!data || data.error) {
    setEmpty(body, (data && data.error) || "Diff failed");
    return;
  }

  clear(body);
  $("diff-meta").textContent = from + " → " + to;

  const score = data.score_change || {};
  const delta = Number(score.delta) || 0;
  const scoreRow = el("div", "diff-score");
  scoreRow.appendChild(document.createTextNode("Attack surface score: "));
  scoreRow.appendChild(el("b", null, (score.before ?? "?") + " → " + (score.after ?? "")));
  if (delta !== 0) {
    const cls = delta > 0 ? "up" : "down";
    scoreRow.appendChild(el("span", cls, (delta > 0 ? "↑ +" : "↓ ") + delta));
  }
  body.appendChild(scoreRow);

  let shown = 0;
  DIFF_GROUPS.forEach(([key, kind, label, fmt]) => {
    const items = (Array.isArray(data[key]) ? data[key] : []).slice(0, DIFF_GROUP_CAP);
    if (!items.length) return;
    shown += items.length;

    const head = el("div", "diff-group-h " + kind, (kind === "added" ? "+ " : kind === "removed" ? "− " : "~ ") + items.length + " " + label);
    body.appendChild(head);
    const table = el("table");
    const tbody = el("tbody");
    const marker = kind === "added" ? "+" : kind === "removed" ? "−" : "~";
    items.forEach((item) => {
      let text;
      try { text = fmt(item); } catch (err) { text = JSON.stringify(item); }
      tbody.appendChild(diffRow("diff-" + (kind === "added" ? "add" : kind === "removed" ? "del" : "chg"), marker, text));
    });
    table.appendChild(tbody);
    body.appendChild(table);
  });

  if (!shown) setEmpty(body, "No differences between the two scans");
}

  $("diff-run").addEventListener("click", runDiff);

    $(id).addEventListener("change", runDiff);

/* ---------- graph (self-contained force layout, no CDN) ---------- */
const NODE_COLORS = {
  domain: "#5B8DEF", subdomain: "#8B91A0", ip: "#3FB68B",
  port: "#E0A458", email: "#C678DD", tech: "#56B6C2",
  cve: "#E5484D", related: "#5A5F6C", unknown: "#5A5F6C",
};

/* Advanced graph state (grafo-avanzado): shared by the toolbar handlers. */
const graphState = {
  nodes: [], edges: [], svg: null, adjacency: [],
  hiddenTypes: new Set(), search: "", pathsOn: false, pathEls: new Set(),
};

function gHubIndex(nodes, degree) {
  // The scan target itself: first 'domain' node, else the highest degree.
  let hub = nodes.findIndex((n) => String(n.type || "").toLowerCase() === "domain");
  if (hub < 0) {
    let best = 0;
    degree.forEach((d, i) => { if (d > degree[best]) best = i; });
    hub = best;
  }
  return hub;
}

function gRiskTypes(nodes) {
  const types = new Set(nodes.map((n) => String(n.type || "").toLowerCase()));
  const risk = ["cve", "bucket"].filter((t) => types.has(t));
  if (!risk.length && types.has("port")) risk.push("port");
  return risk;
}

function gAttackPathSet(nodes, adjacency, hub, riskTypes) {
  // BFS from the hub; returns the Set of node indexes + edge keys on any
  // shortest hub→risk-node path (classic attack-path highlight).
  const onPath = new Set();
  if (hub < 0 || hub >= nodes.length || !riskTypes.length) return onPath;
  const prev = new Array(nodes.length).fill(-2);
  const prevEdge = new Array(nodes.length).fill(null);
  prev[hub] = -1;
  const queue = [hub];
  while (queue.length) {
    const u = queue.shift();
    for (const { to, key } of adjacency[u] || []) {
      if (prev[to] === -2) {
        prev[to] = u;
        prevEdge[to] = key;
        queue.push(to);
      }
    }
  }
  nodes.forEach((n, i) => {
    if (!riskTypes.includes(String(n.type || "").toLowerCase())) return;
    if (prev[i] === -2) return;  // unreachable from the hub
    let cur = i;
    while (cur !== -1) {
      onPath.add("n" + cur);
      const key = prevEdge[cur];
      if (key) onPath.add(key);
      cur = prev[cur];
    }
  });
  return onPath;
}

function gApplyFilters() {
  const st = graphState;
  if (!st.svg) return;
  const q = st.search.trim().toLowerCase();
  const riskTypes = gRiskTypes(st.nodes);
  const degree = new Array(st.nodes.length).fill(0);
  st.edges.forEach((e) => { degree[e._s]++; degree[e._t]++; });
  const hub = gHubIndex(st.nodes, degree);
  const onPath = st.pathsOn
    ? gAttackPathSet(st.nodes, st.adjacency, hub, riskTypes)
    : null;

  st.pathEls.forEach((elm) => elm.removeAttribute("stroke"));
  st.pathEls.clear();

  st.nodes.forEach((n, i) => {
    const type = String(n.type || "unknown").toLowerCase();
    const label = String(n.label || n.id || "");
    const hidden = st.hiddenTypes.has(type);
    const match = !q || label.toLowerCase().includes(q);
    const dimmed = hidden || (q && !match) || (onPath && !onPath.has("n" + i));
    n._g.setAttribute("opacity", dimmed ? "0.12" : "1");
    if (onPath && onPath.has("n" + i)) {
      const c = n._g.querySelector("circle");
      if (c) { c.setAttribute("stroke", "#F5A623"); c.setAttribute("stroke-width", "2"); st.pathEls.add(c); }
    }
  });
  st.edges.forEach((e, i) => {
    const key = "e" + i;
    if (onPath && onPath.has(key)) {
      e._line.setAttribute("stroke", "#F5A623");
      e._line.setAttribute("stroke-opacity", "1");
      e._line.setAttribute("stroke-width", "2");
      st.pathEls.add(e._line);
    } else {
      e._line.removeAttribute("stroke");
      e._line.setAttribute("stroke-opacity", onPath ? "0.08" : "0.8");
    }
  });
}

function gDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function gExportSvg() {
  if (!graphState.svg) return;
  const clone = graphState.svg.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  const blob = new Blob([new XMLSerializer().serializeToString(clone)],
                        { type: "image/svg+xml" });
  gDownload(blob, "osint_eye_graph.svg");
}

function gExportPng() {
  if (!graphState.svg) return;
  const clone = graphState.svg.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  const src = "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(new XMLSerializer().serializeToString(clone));
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = graphState.svg.clientWidth || 800;
    canvas.height = graphState.svg.clientHeight || 420;
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => { if (blob) gDownload(blob, "osint_eye_graph.png"); }, "image/png");
  };
  img.src = src;
}

async function renderGraph(target) {
  const box = $("graph-box");
  const meta = $("graph-meta");
  // keep the legend node, drop the rest
  const legend = $("graph-legend");
  Array.from(box.children).forEach((child) => { if (child !== legend) child.remove(); });

  const graph = await getJSON(`/api/scan/${encodeURIComponent(target)}/graph`);
  const nodes = (graph && graph.nodes) || [];
  const edges = (graph && graph.edges) || [];

  meta.textContent = nodes.length ? nodes.length + " nodes · " + edges.length + " edges" : "";
  if (!nodes.length) {
    const empty = el("div", "empty", "No graph data available");
    box.appendChild(empty);
    return;
  }

  const W = box.clientWidth || 800;
  const H = box.clientHeight || 420;

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  // Inline styles so a serialized SVG (PNG/SVG export) keeps its look
  // without the page CSS — and without any external resource.
  const gstyle = document.createElementNS("http://www.w3.org/2000/svg", "style");
  gstyle.textContent =
    ".g-edge{stroke:#3A3F4C;stroke-opacity:.8}" +
    ".g-label{fill:#8B91A0;font-size:10.5px;font-family:ui-monospace,Menlo,monospace}";
  svg.appendChild(gstyle);
  const edgeG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const nodeG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  svg.appendChild(edgeG); svg.appendChild(nodeG);
  box.appendChild(svg);

  graphState.nodes = nodes;
  graphState.svg = svg;
  graphState.hiddenTypes = new Set();
  graphState.search = "";
  graphState.pathsOn = false;
  $("g-paths").classList.remove("active");
  $("g-search").value = "";

  // deterministic initial positions (ring)
  nodes.forEach((n, i) => {
    const a = (2 * Math.PI * i) / nodes.length;
    n.x = W / 2 + (W / 3.2) * Math.cos(a);
    n.y = H / 2 + (H / 3.2) * Math.sin(a);
  });
  const idx = new Map(nodes.map((n, i) => [n.id !== undefined ? n.id : i, i]));

  const lines = edges.map((e) => {
    const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ln.setAttribute("class", "g-edge");
    edgeG.appendChild(ln);
    e._line = ln;
    e._s = idx.get(e.source);
    e._t = idx.get(e.target !== undefined ? e.target : e.to);
    return e;
  }).filter((e) => e._s !== undefined && e._t !== undefined);

  // degree per node (drives which labels stay visible on dense graphs)
  const degree = new Array(nodes.length).fill(0);
  lines.forEach((e) => { degree[e._s]++; degree[e._t]++; });

  // graphState.adjacency for attack-path BFS (grafo-avanzado)
  graphState.edges = lines;
  graphState.adjacency = nodes.map(() => []);
  lines.forEach((e, i) => {
    graphState.adjacency[e._s].push({ to: e._t, key: "e" + i });
    graphState.adjacency[e._t].push({ to: e._s, key: "e" + i });
  });

  const circles = nodes.map((n) => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "g-node");
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    const r = Math.min(13, Math.max(4, (Number(n.size) || 12) * 0.42));
    c.setAttribute("r", r);
    c.setAttribute("fill", n.color || NODE_COLORS[String(n.type || "unknown").toLowerCase()] || NODE_COLORS.unknown);
    c.setAttribute("fill-opacity", "0.9");
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "g-label");
    t.setAttribute("x", 0); t.setAttribute("y", r + 11);
    t.setAttribute("text-anchor", "middle");
    const label = String(n.label || n.id || "");
    t.textContent = label;
    // Labels for hubs (high degree) or short names; others reveal on hover
    const i = nodes.indexOf(n);
    const isHub = degree[i] >= 4 || label.length <= 10;
    if (!isHub) t.setAttribute("opacity", "0");
    g.appendChild(c); g.appendChild(t);
    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = label + (n.type ? " · " + n.type : "");
    g.appendChild(title);
    g.addEventListener("mouseenter", () => { t.setAttribute("opacity", "1"); });
    g.addEventListener("mouseleave", () => { if (!isHub) t.setAttribute("opacity", "0"); });
    nodeG.appendChild(g);
    n._g = g; n._r = r;

    // drag
    let dragging = false;
    g.addEventListener("mousedown", (ev) => { dragging = true; ev.preventDefault(); });
    window.addEventListener("mousemove", (ev) => {
      if (!dragging) return;
      const rect = svg.getBoundingClientRect();
      n.x = ((ev.clientX - rect.left) / rect.width) * W;
      n.y = ((ev.clientY - rect.top) / rect.height) * H;
    });
    window.addEventListener("mouseup", () => { dragging = false; });
    return g;
  });

  // legend = type filter chips (grafo-avanzado)
  clear(legend);
  const types = [...new Set(nodes.map((n) => String(n.type || "unknown").toLowerCase()))];
  types.slice(0, 8).forEach((t) => {
    const chip = el("button", "g-chip on", t);
    chip.type = "button";
    chip.addEventListener("click", () => {
      if (graphState.hiddenTypes.has(t)) graphState.hiddenTypes.delete(t);
      else graphState.hiddenTypes.add(t);
      chip.classList.toggle("on", !graphState.hiddenTypes.has(t));
      gApplyFilters();
    });
    legend.appendChild(chip);
  });

  // simple force simulation
  let alpha = 0.9;
  const tick = () => {
    if (alpha < 0.005) { requestAnimationFrame(tick); return; }
    // repulsion
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
        const d = Math.sqrt(d2);
        const f = (3200 / d2) * alpha;
        const fx = (dx / d) * f, fy = (dy / d) * f;
        a.x -= fx; a.y -= fy; b.x += fx; b.y += fy;
      }
    }
    // springs
    edges.forEach((e) => {
      const a = nodes[e._s], b = nodes[e._t];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = ((d - 110) * 0.02) * alpha;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.x += fx; a.y += fy; b.x -= fx; b.y -= fy;
    });
    // gravity + bounds
    nodes.forEach((n) => {
      n.x += (W / 2 - n.x) * 0.02 * alpha;
      n.y += (H / 2 - n.y) * 0.02 * alpha;
      n.x = Math.max(30, Math.min(W - 30, n.x));
      n.y = Math.max(24, Math.min(H - 24, n.y));
    });
    alpha *= 0.985;

    edges.forEach((e) => {
      const a = nodes[e._s], b = nodes[e._t];
      e._line.setAttribute("x1", a.x); e._line.setAttribute("y1", a.y);
      e._line.setAttribute("x2", b.x); e._line.setAttribute("y2", b.y);
    });
    nodes.forEach((n) => {
      n._g.setAttribute("transform", `translate(${n.x},${n.y})`);
    });
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ---------- auto-refresh (monitor mode) ---------- */
/* ---------- surface timeline (evolution between scans) ---------- */
function tlDeltaLine(listEl, label, assets, count) {
  if (!count) return;
  const li = el("li");
  const b = el("b", null, label + " (" + count + "):");
  li.appendChild(b);
  li.appendChild(document.createTextNode(" "));
  assets.slice(0, 6).forEach((a, i) => {
    if (i) li.appendChild(document.createTextNode(", "));
    li.appendChild(el("span", null, a.name));
  });
  if (count > assets.length) {
    li.appendChild(document.createTextNode(" …"));
  }
  listEl.appendChild(li);
}

async function renderTimeline(target) {
  const body = $("timeline-body");
  const data = await getJSON(`/api/scan/${encodeURIComponent(target)}/timeline`);
  if (!data || !Array.isArray(data.timeline)) {
    setEmpty(body, "Timeline unavailable");
    $("timeline-meta").textContent = "";
    return;
  }
  $("timeline-meta").textContent =
    data.timeline.length + (data.timeline.length === 1 ? " scan" : " scans");

  clear(body);
  const wrap = el("div", "tl");
  // oldest → newest, newest at the bottom of the rail
  data.timeline.forEach((ev) => {
    const item = el("div", "tl-event");
    const head = el("div", "tl-head");
    head.appendChild(el("span", "tl-date", String(ev.date || "—").replace("T", " ").slice(0, 19)));
    head.appendChild(el("span", "tl-target", ev.target || ""));
    head.appendChild(el("span", "tl-score",
      "depth " + (ev.depth || "—") + " · risk " + (ev.score ?? 0) +
      (ev.severity ? " (" + ev.severity + ")" : "")));
    item.appendChild(head);

    const deltas = el("div", "tl-deltas");
    const up = ev.new_count || 0, down = ev.removed_count || 0;
    if (up) deltas.appendChild(el("span", "tl-badge up", "+" + up + " new"));
    if (down) deltas.appendChild(el("span", "tl-badge down", "−" + down + " gone"));
    if (!up && !down) deltas.appendChild(el("span", "tl-badge flat", "no changes vs previous"));
    item.appendChild(deltas);

    const list = el("ul", "tl-list");
    tlDeltaLine(list, "new", ev.new || [], up);
    tlDeltaLine(list, "gone", ev.removed || [], down);
    if ((ev.new_count || 0) || (ev.removed_count || 0)) item.appendChild(list);
    wrap.appendChild(item);
  });
  body.appendChild(wrap);
}

const live = { enabled: false, paused: false, intervalS: 60, timer: null, failures: 0, lastKey: "" };

async function initLiveRefresh() {
  const cfg = await getJSON("/api/dashboard/config");
  if (!cfg || !cfg.auto_refresh) return;
  live.enabled = true;
  live.intervalS = Math.max(5, Math.min(3600, cfg.interval_s | 0 || 60));
  $("live-label").textContent = "LIVE · " + live.intervalS + "s";
  $("live-chip").hidden = false;
  $("live-toggle").addEventListener("click", toggleLive);
  document.addEventListener("visibilitychange", () => {
    if (!live.enabled || live.paused) return;
    if (document.hidden) stopTimer(); else startTimer();
  });
  startTimer();
}

function startTimer() {
  stopTimer();
  live.timer = setInterval(pollTick, live.intervalS * 1000);
  $("live-chip").classList.remove("paused");
  $("live-toggle").textContent = "pause";
}

function stopTimer() {
  if (live.timer) { clearInterval(live.timer); live.timer = null; }
}

function toggleLive() {
  live.paused = !live.paused;
  if (live.paused) {
    stopTimer();
    $("live-chip").classList.add("paused");
    $("live-label").textContent = "PAUSED";
    $("live-toggle").textContent = "resume";
  } else {
    $("live-label").textContent = "LIVE · " + live.intervalS + "s";
    startTimer();
    pollTick();
  }
}

function scansKeyOf(data) {
  return JSON.stringify(
    (data.scans || []).map((s) => [s.target, s.date, s.refreshed_at || ""])
  );
}

async function pollTick() {
  const data = await getJSON("/api/scans");
  if (!data) {
    live.failures += 1;
    if (live.failures >= 3) {
      stopTimer();
      live.enabled = false;
      $("live-chip").classList.add("paused");
      $("live-label").textContent = "OFFLINE";
      $("live-toggle").textContent = "resume";
    }
    return;
  }
  live.failures = 0;
  const key = scansKeyOf(data);
  if (key === live.lastKey) return;
  live.lastKey = key;
  // Soft reload: loadTargets(keepTarget) preserves the user's selection.
  await loadTargets(currentTarget);
}

(function wireGraphToolbar() {
  $("g-search").addEventListener("input", (ev) => {
    graphState.search = ev.target.value || "";
    gApplyFilters();
  });
  $("g-paths").addEventListener("click", (ev) => {
    graphState.pathsOn = !graphState.pathsOn;
    ev.target.classList.toggle("active", graphState.pathsOn);
    gApplyFilters();
  });
  $("g-export-svg").addEventListener("click", gExportSvg);
  $("g-export-png").addEventListener("click", gExportPng);
})();

loadTargets();
initLiveRefresh();
